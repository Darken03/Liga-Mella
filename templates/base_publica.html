<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
{% load static %}<link href="{% static 'css/styles.css' %}" rel="stylesheet"></head>
<body><nav class="navbar navbar-expand-lg nav-mella navbar-dark sticky-top"><div class="container">
<a class="navbar-brand" href="/"><span class="brand-ball">⚾</span>LIGA <em>MELLA</em></a>
