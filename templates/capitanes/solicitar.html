{% extends 'base_capitan.html' %}{% block content %}<div class="col-lg-7"><div class="card card-mella p-4"><h3 class="oswald">Solicitar jugador para {{ equipo.nombre }}</h3><p class="text-muted">El jugador debe tener cuenta. Al enviarle la solicitud, él la acepta en <strong>Mi cuenta → Mis solicitudes</strong> y entra a tu roster.</p><form method="post">{% csrf_token %}<label class="form-label">Usuario (jugador)</label><select name="usuario" class="form-select mb-3" required>{% for u in usuarios %}<option value="{{ u.id }}">@{{ u.username }} — {{ u.first_name }} {{ u.last_name }} ({{ u.rol }})</option>{% endfor %}</select><label class="form-label">Mensaje para el jugador (motivo)</label><textarea name="mensaje" class="form-control mb-3" rows="3" maxlength="500" placeholder="Ej: Te necesitamos como shortstop titular..."></textarea><button class="btn btn-gold">Enviar solicitud</button> <a class="btn btn-ghost" href="{% url 'cap_dash' %}">Volver</a></form></div></div>{% endblock %}
