<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Anotador{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">{% load static %}<link href="{% static 'css/styles.css' %}" rel="stylesheet"></head>
<body style="background:#0A1A3A"><div class="container-fluid"><div class="row"><div class="col-12 col-lg-2 sidebar p-3 d-flex flex-column" id="sidebar"><div><h4 class="oswald">⚾ ANOTADOR</h4><a href="/anotador/">Juegos</a><a href="/reglas/">Reglas</a></div><div class="mt-auto pt-3"><a class="btn-site" href="/"><i class="bi bi-globe"></i>Ver sitio público</a><form method="post" action="/cuenta/logout/" class="mt-2">{% csrf_token %}<button class="btn btn-gold w-100" type="submit">Cerrar sesión</button></form></div></div><div class="col-12 col-lg-10 p-3 panel-dark" id="pcontent" style="background:#0A1A3A;min-height:100vh"><div class="panel-top"><button id="sbToggle" class="act view" title="Ocultar/mostrar menú"><i class="bi bi-list"></i></button><span class="oswald">ANOTADOR</span><span class="ms-auto d-flex align-items-center gap-2">{% if user.is_authenticated %}{% include 'notificaciones/_bell.html' %}<a class="nav-link p-0 text-white" href="/cuenta/redirigir/">Mi perfil</a>{% endif %}</span></div>{% block content %}{% endblock %}</div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>(function(){var b=document.getElementById('sbToggle'),s=document.getElementById('sidebar'),c=document.getElementById('pcontent');if(!b||!s||!c)return;var h=localStorage.getItem('sb')==='1';function ap(){s.classList.toggle('d-none',h);c.classList.toggle('col-lg-10',!h);c.classList.toggle('col-lg-12',h);}b.addEventListener('click',function(){h=!h;try{localStorage.setItem('sb',h?'1':'0');}catch(e){}ap();});ap();})();</script></body></html>
