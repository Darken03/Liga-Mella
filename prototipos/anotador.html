<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anotador | Liga Mella</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet"></head>
<body style="background:#0A1A3A"><div class="container py-3">
<div class="scoreboard p-3 text-center mb-3"><small class="badge badge-live">EN VIVO • 6TO ALTA</small><h2 class="oswald mt-2">LEO <span class="score">5</span> — <span class="score">4</span> TOR</h2><small>Bases: ●○○ • Outs: 1 • Bolas/Strikes: 2-1</small></div>
<div class="card card-mella p-3 mb-3"><h5 class="oswald">Registrar jugada — Batea J. Pérez</h5><div class="row g-2">
<div class="col-6 col-md-4"><button class="btn btn-success btn-score w-100" onclick="sumar('LEO')">+ Carrera LEO</button></div>
<div class="col-6 col-md-4"><button class="btn btn-outline-danger btn-score w-100" onclick="sumar('TOR')">+ Carrera TOR</button></div>
<div class="col-6 col-md-4"><button class="btn btn-navy btn-score w-100">Out</button></div>
<div class="col-6 col-md-4"><button class="btn btn-ghost btn-score w-100">Hit</button></div>
<div class="col-6 col-md-4"><button class="btn btn-ghost btn-score w-100">BB</button></div>
<div class="col-6 col-md-4"><button class="btn btn-gold btn-score w-100">HR</button></div>
</div></div>
<div class="card card-mella p-3"><h5 class="oswald">Entradas</h5><div class="table-responsive"><table class="table table-sm text-center"><tr><th></th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>C</th></tr><tr><th>LEO</th><td>1</td><td>0</td><td>2</td><td>0</td><td>2</td><td id="cLEO">0</td><td id="tLEO"><b>5</b></td></tr><tr><th>TOR</th><td>0</td><td>3</td><td>0</td><td>1</td><td>0</td><td id="cTOR">0</td><td id="tTOR"><b>4</b></td></tr></table></div><button class="btn btn-mella w-100">Finalizar juego</button><a href="index.html" class="btn btn-link w-100">← Salir</a></div>
</div><script>let leo=5,tor=4;function sumar(eq){if(eq==='LEO'){leo++;document.getElementById('tLEO').innerHTML='<b>'+leo+'</b>';}else{tor++;document.getElementById('tTOR').innerHTML='<b>'+tor+'</b>';}}</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
